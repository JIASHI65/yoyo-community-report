name: Large Group Weekly Report

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate large group weekly report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FEISHU_LARGE_WEBHOOK: ${{ secrets.FEISHU_LARGE_WEBHOOK }}
        run: |
          python3 scripts/generate_large_weekly.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add large-weekly.html large_weekly_cache.json
          git diff --staged --quiet || (git commit -m "large group weekly report auto-update" && git push)
