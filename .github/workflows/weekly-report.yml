name: Weekly Community Report

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      publish_to_feishu:
        description: '确认推送到飞书群（定时任务永远不会推送）'
        required: true
        default: false
        type: boolean
      operator_note:
        description: '运营观察/建议（可选，将自然展示在周报中）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate weekly report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PUBLISH_TO_FEISHU: ${{ inputs.publish_to_feishu }}
          OPERATOR_NOTE: ${{ inputs.operator_note }}
        run: |
          python3 scripts/generate_weekly.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly.html index.html
          git diff --staged --quiet || (git commit -m "weekly report auto-update" && git push)
