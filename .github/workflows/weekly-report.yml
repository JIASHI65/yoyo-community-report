name: Weekly Community Report

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      editorial_context:
        description: '你希望融入 LLM 深度分析的判断或信息（可选）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate weekly report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          EDITORIAL_CONTEXT: ${{ inputs.editorial_context }}
          FEISHU_PREVIEW_WEBHOOK: ${{ secrets.FEISHU_PREVIEW_WEBHOOK }}
        run: |
          python3 scripts/generate_weekly.py
          python3 scripts/send_weekly_preview.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly.html index.html weekly-draft.md weekly-feishu-payload.json
          git diff --staged --quiet || (git commit -m "weekly report auto-update" && git push)
