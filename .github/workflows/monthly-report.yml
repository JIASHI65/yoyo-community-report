name: Monthly Community Report

on:
  schedule:
    - cron: '0 4 1 * *'  # Every 1st of the month 04:00 UTC
  workflow_dispatch:
    inputs:
      report_month:
        description: '指定统计月份，例如 2026-08；留空则按当前月份'
        required: false
        type: string
      publish_to_feishu:
        description: '确认推送月报到飞书'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate monthly report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FEISHU_MONTHLY_WEBHOOK: ${{ secrets.FEISHU_MONTHLY_WEBHOOK }}
          REPORT_MONTH: ${{ inputs.report_month }}
          PUBLISH_TO_FEISHU: ${{ inputs.publish_to_feishu }}
        run: |
          python3 scripts/generate_monthly.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monthly.html index.html
          git diff --staged --quiet || (git commit -m "monthly report auto-update" && git push)
