name: Monthly Community Report

on:
  schedule:
    - cron: '0 4 1 * *'  # Every 1st of the month 04:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate monthly report
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEISHU_MONTHLY_WEBHOOK: ${{ secrets.FEISHU_MONTHLY_WEBHOOK }}
        run: |
          python3 scripts/generate_monthly.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "monthly report auto-update" && git push origin main:gh-pages)
